name: aqfcore-charttopng-ci

env:
  FOLDER_NAME: aqfcore-charttopng
  IMAGE_NAME: aqfcore/aqfcore-charttopng
  IMAGE_COMMIT_TAG: ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_COMMIT_TAG }}
            ${{ vars.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ vars.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  update-tag:
    needs: deploy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: AquaFlowCL
          repositories: aqfcore-deployments
      - uses: actions/checkout@v4
        with:
          repository: AquaFlowCL/aqfcore-deployments
          token: ${{ steps.app-token.outputs.token }}
          ref: main
      - name: Update image tag
        run: |
          sed -i 's|tag:.*|tag: "${{ env.IMAGE_COMMIT_TAG }}"|' "${{ env.FOLDER_NAME }}/values-prod.yaml"
      - name: Commit and push
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "${{ env.FOLDER_NAME }}/values-prod.yaml"
          git commit -m "chore: update ${{ env.IMAGE_NAME }} image to tag ${{ env.IMAGE_COMMIT_TAG }}"
          git push
